<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Notes, draft B: inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&family=DM+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400&family=Amiri:wght@400&display=swap" rel="stylesheet">
<style>
/* Deal: palette green-black-bone, type outfit, radius soft */
:root{
  --bg:#161c1a; --surface:#1f2725; --raised:#26302d; --ink:#e3e2da; --accent:#9fc7b8;
  --muted:#a3a89f; --line:rgba(227,226,218,.12); --line-strong:rgba(227,226,218,.26);
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --f-ui:"Outfit",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
  --f-ur:"Noto Nastaliq Urdu","Urdu Typesetting",serif; --f-ar:"Amiri",serif;
  --m-in:140ms; --m-press:90ms; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-ui);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px minmax(420px,1fr) 440px;grid-template-rows:auto 1fr;height:100vh}

.top{grid-column:1/4;display:grid;grid-template-columns:248px 1fr auto;align-items:center;border-bottom:1px solid var(--line);height:64px}
.brand{display:flex;align-items:center;gap:12px;padding:0 20px;font-weight:500;font-size:19px;letter-spacing:-.02em}
.brand img{width:26px;height:26px;border-radius:7px}
.transport{display:flex;align-items:center;gap:16px;padding:0 24px;border-left:1px solid var(--line);height:100%}
.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;cursor:pointer;transition:background var(--m-in) var(--ease),transform var(--m-in) var(--ease)}
.icon:hover{background:var(--surface)} .icon:active{transform:scale(.94)}
.icon svg{width:20px;height:20px}
.play{width:44px;height:44px;background:var(--accent);color:#13201b}
.play:hover{background:#b6d6ca}
.time{font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.bar{position:relative;flex:1;height:6px;background:var(--raised);border-radius:3px;min-width:120px}
.bar i{position:absolute;inset:0 auto 0 0;width:44%;background:var(--accent);border-radius:3px}
.bar u{position:absolute;top:-5px;width:2px;height:16px;background:#e0a84f}
select{height:36px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 8px;font:500 13px var(--f-mono)}
.topact{display:flex;gap:12px;padding:0 20px}

.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-sm);font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--line-strong);background:transparent;transition:transform var(--m-in) var(--ease),background var(--m-in) var(--ease),border-color var(--m-in) var(--ease)}
.btn:hover{transform:translateY(-1px);background:var(--surface);border-color:var(--ink)}
.btn:active{transform:translateY(1px) scale(.985);transition-duration:var(--m-press)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#13201b}
.btn--primary:hover{background:#b6d6ca;border-color:#b6d6ca}
.btn:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font:500 12px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.link{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-size:14px;font-weight:500;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;transition:text-decoration-color var(--m-in) var(--ease)}
.link:hover{text-decoration-color:currentColor}

.side{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.field{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.field input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.field:focus-within{border-color:var(--accent)}
.label{font-size:13px;font-weight:500;color:var(--muted);margin-top:8px}
.cls{display:block;padding:12px;border-radius:var(--r-sm);background:var(--surface);text-decoration:none;color:inherit}
.cls b{display:block;font-weight:500;font-size:15px} .cls span{font-size:13px;color:var(--muted)}
.side .grow{flex:1}

.list{overflow:auto;min-height:0;border-right:1px solid var(--line)}
.listhead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);z-index:1}
.listhead h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}
.listhead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:64px 36px 1fr;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--m-in) var(--ease)}
.row:hover{background:var(--surface)}
.row.playing{background:var(--raised)}
.row time{font:500 13px/1.6 var(--f-mono);color:var(--muted)}
.row.playing time{color:var(--accent)}
.badge{font-size:13px;font-weight:500;color:var(--muted);line-height:1.6}
.row p{margin:0;font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a84f;margin-right:8px;vertical-align:1px}
.qtag{display:inline-block;font-size:13px;font-weight:500;color:var(--accent);margin-right:8px}

.insp{overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px;min-height:0}
.insp h2{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.big-ur{font-family:var(--f-ur);font-size:22px;line-height:2.2;direction:rtl;text-align:right;margin:0}
textarea{width:100%;min-height:140px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:12px;font-size:16px;line-height:1.6;resize:vertical;outline:0}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(159,199,184,.18)}
.btnrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact{background:var(--surface);border-radius:var(--r-md);padding:12px 16px}
.fact span{display:block;font-size:13px;color:var(--muted)} .fact b{font-weight:500}
.card{background:var(--surface);border-radius:var(--r-md);padding:16px}
.card .ar{font-family:var(--f-ar);font-size:24px;line-height:1.9;direction:rtl;text-align:right;margin:8px 0}
.card p{margin:0;font-size:15px}
.learn .ur{font-family:var(--f-ur);font-size:18px;line-height:2}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><img src="../../../src/classnotes/ui/icon.png" alt="">Class Notes</div>
    <div class="transport">
      <button class="icon" title="Previous line (←)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="icon play" title="Play or pause (Space)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="icon" title="Next line (→)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <span class="time">45:05</span><div class="bar" id="bar"><i></i></div><span class="time">1:42:34</span>
      <select aria-label="Speed"><option>0.75×</option><option selected>1×</option><option>1.25×</option><option>1.5×</option></select>
      <select aria-label="Sound output"><option>Windows default output</option><option>Speakers (Realtek)</option><option>Headphones (Bluetooth)</option></select>
    </div>
    <div class="topact"><button class="btn">Export</button></div>
  </div>

  <aside class="side">
    <label class="field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search all classes"><span class="kbd">Ctrl K</span></label>
    <div class="label">Classes</div>
    <a class="cls" href="#"><b>Session 19 · Hijrat e Rasool (SAW)</b><span>18 Nov 2026 · 1:42:34</span></a>
    <div class="grow"></div>
    <button class="btn btn--primary">Add a class</button>
    <button class="btn">Glossary and settings</button>
  </aside>

  <section class="list">
    <div class="listhead"><div><h1 id="title"></h1><p id="sub"></p></div><button class="btn" id="nextflag">Next to check <span class="kbd">F</span></button></div>
    <div id="rows"></div>
  </section>

  <section class="insp" id="insp"></section>
</div>
<script src="data.js"></script>
<script>
const C = window.CLASS, $ = s => document.querySelector(s);
const clock = t => { t = Math.floor(t); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : String(m).padStart(2,"0")) + ":" + String(s).padStart(2,"0"); };
$("#title").textContent = C.title;
$("#sub").textContent = `${C.date} · ${C.lines} lines · 4 to check`;
let cur = C.playing;
function render(){
  $("#rows").innerHTML = C.segments.map(s => `<div class="row${s.id===cur?" playing":""}" data-id="${s.id}">
    <time>${clock(s.start)}</time><span class="badge">${s.lang==="ur"?"UR":"EN"}</span>
    <p>${s.flag?'<span class="dot" title="Check this line"></span>':""}${C.quran.seg===s.id?'<span class="qtag">9:40</span>':""}${s.text}</p></div>`).join("");
  const s = C.segments.find(x => x.id === cur);
  const q = C.quran.seg === s.id ? `<div class="card"><h2>Quran · ${C.quran.ref}</h2><div class="ar">${C.quran.arabic}</div><p>${C.quran.english}</p><p style="font-size:13px;color:var(--muted);margin-top:8px">${C.quran.translator}</p></div>` : "";
  $("#insp").innerHTML = `
    <div><h2>Playing · ${clock(s.start)} to ${clock(s.end)}</h2></div>
    <p class="big-ur">${s.source}</p>
    <div><h2 style="margin-bottom:8px">English</h2><textarea id="ed">${s.text}</textarea>
      <div class="btnrow" style="margin-top:12px"><button class="btn btn--primary">Save line</button><button class="btn">Replay line <span class="kbd">R</span></button><button class="link">Revert to machine</button></div></div>
    ${q}
    <div class="facts"><div class="fact"><span>Language</span><b>${s.lang==="ur"?"Urdu":"English"} · ${Math.round(s.lang_conf*100)}% sure</b></div>
      <div class="fact"><span>Check</span><b>${s.flag ?? "Nothing to check"}</b></div></div>
    <div class="card learn"><h2>Learned from your edits</h2><p style="margin-top:8px">“${C.learned.from}” → “${C.learned.to}” for <span class="ur">${C.learned.urdu}</span>. ${C.learned.others} other lines in this class use it.</p>
      <div class="btnrow" style="margin-top:12px"><button class="btn">Update ${C.learned.others} lines and future classes</button><button class="link">Not now</button></div></div>`;
}
render();
document.addEventListener("click", e => { const r = e.target.closest(".row"); if (r) { cur = +r.dataset.id; render(); } });
const flagged = C.segments.filter(s => s.flag).map(s => s.id);
$("#nextflag").onclick = () => { cur = flagged.find(id => id > cur) ?? flagged[0]; render(); };
C.segments.filter(s => s.flag).forEach(s => { const u = document.createElement("u"); u.style.left = (s.start / C.duration * 100) + "%"; $("#bar").appendChild(u); });
</script>
</body>
</html>
