[project]
name = "classnotes"
version = "0.1.0"
description = "Local Urdu/English class recordings -> timestamped English translation notes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "numpy>=1.26",
    "PySide6>=6.7",
    "platformdirs>=4.0",
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.0",
]

[project.scripts]
classnotes = "classnotes.ui.app:main"

[dependency-groups]
convert = ["torch>=2.4"]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["dev", "convert"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
